<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Project</title>
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>
</head>
<body class="body-element">
<div id="outer-shell">
<div id="top-header" class="top-header">Calculator</div>
<!--Top Column with Logo & Solar Panel-->
<div class="columns" id="top-column">
<div id="casio-logo">
CASIO
</div>
<div id="solar-panel">
SOLAR PANEL
</div>
</div>

<!--Second Column with Total Display-->
<div class="columns" id="second-column">
<div id="total-button-display">

</div>
</div>

<!--Third Column Buttons: SL-300SV Sq.Root, Off-->
<div class="columns" id="third-column">
<div class="operator" id="sl300sv">
S1300SV
</div>
<div class="operator" id="square-root">
SqRoot √
</div>
<!--OFF BUTTON-->
<div class="number" id="off-key">
OFF
</div>
</div>

<!--Fourth Column Buttons: MC, MR M- M+ division-->
<div class="columns" id="fourth-column">
<div id="mc-key">
MC
</div>
<div id="mr-key">
MR
</div>
<div id="m-minus-key">
M-
</div>
<div id="m-plus-key">
M+
</div>
<div id="division-key">
÷
</div>
</div>

<!--Fifth Column Buttons: %, 7, 8, 9, multiplication-->
<div class="columns" id="fifth-column">
<div class="operator" id="percent-key">
%
</div>
<div class="number" id="number-seven-key">
7
</div>

<div class="number" id="number-eight-key">
8
</div>

<div class="number" id="number-nine-key">
9
</div>

<div class="operator" id="multiplication-key">

</div>
</div>

<!--Sixth Column Buttons: -->
<div class="columns" id="sixth-column">
<div class="operator" id="change-sign-key">
+/-
</div>

<div class="number numbers" id="number-four-key">
4
</div>

<div class="number numbers" id="number-five-key">
5
</div>

<div class="number" id="number-six-key">
6
</div>

<div class="operator" id="minus-key">
-
</div>

</div>

<!--Seventh Column Buttons: clear, 1, 2, 3, plus-->
<div class="columns" id="seventh-column">
<div class="operator" id="clear-key">
C
</div>

<div class="number" id="number-one-key">
1
</div>

<div class="number" id="number-two-key">
2
</div>

<div class="number" id="number-three-key">
3
</div>

<div class="operator" id="addition-key">
+
</div>
</div>

<!--Eighth Column Buttons: all clear, 0, ., =, plus -->
<div class="columns" id="eighth-column">
<div class="operator" id="all-clear-key">
AC
</div>

<div class="number" id="zero-key">
0
</div>

<div class="operator" id="decimal-key">
.
</div>

<div class="operator" id="equal-key">
=
</div>

<div class="operator" id="blank-key">
◡̈
</div>
</div>
<div id="last-column" class="columns"">
<div id="author-signature" class="columns">
Built by Oladeyi Ifaloseyi
</div>
</div>
</div>
</body>
</html>
